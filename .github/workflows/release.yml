name: release

on:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [darwin-x64, darwin-arm64, linux-x64, win32-x64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test
        run: cd backend && go test ./...
      - name: Package ${{ matrix.target }}
        run: node tools/pack.mjs ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: dbxp-${{ matrix.target }}
          path: dist/*.dbxp

  # 单 job 发布：matrix 各 job 并发调 action-gh-release 会抢建同一个 nightly 而 422
  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: dbxp-*
          merge-multiple: true
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'nightly' }}
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/') }}
          generate_release_notes: ${{ startsWith(github.ref, 'refs/tags/') }}
          files: dist/*.dbxp
